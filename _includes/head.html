<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">

{% assign page_title = page.title | default: site.title %}
{% assign page_description = page.description | default: site.description %}
<title>{{ page_title }}</title>
<meta name="description" content="{{ page_description }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<meta property="og:type" content="website">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ page_description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/images/Serani.jpg' | absolute_url }}">
<meta name="twitter:card" content="summary">

<link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/styles.css' | relative_url }}">
<meta name="theme-color" content="#102a43">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Andrea Serani",
  "url": "{{ '/' | absolute_url }}",
  "image": "{{ '/images/Serani.jpg' | absolute_url }}",
  "jobTitle": "Research Scientist",
  "affiliation": [
    {
      "@type": "Organization",
      "name": "CNR-INM",
      "url": "https://www.inm.cnr.it"
    },
    {
      "@type": "CollegeOrUniversity",
      "name": "University of Bologna",
      "url": "https://www.unibo.it"
    },
    {
      "@type": "CollegeOrUniversity",
      "name": "University of Michigan",
      "url": "https://umich.edu"
    }
  ],
  "sameAs": [
    "https://orcid.org/0000-0002-8814-1793",
    "https://scholar.google.com/citations?user=_Tz_sf8AAAAJ",
    "https://github.com/aserani",
    "https://www.linkedin.com/in/andrea-serani/"
  ]
}
</script>
